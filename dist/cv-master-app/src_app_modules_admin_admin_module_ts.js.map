<p-confirmDialog [style]="{ width: '420px' }"></p-confirmDialog>

<div class="page-wrapper">
  <div class="page-header flex items-start justify-between">
    <div>
      <h1>Utilisateurs</h1>
      <p>Gérez les comptes, rôles et statuts.</p>
    </div>
    <button pButton pRipple label="Nouvel utilisateur" icon="pi pi-plus"
            class="btn-primary" (click)="openCreate()"></button>
  </div>

  <!-- Table card -->
  <div class="bg-white rounded-2xl border border-slate-100 overflow-hidden">

    <div class="flex items-center justify-between px-5 py-4 border-b border-slate-100">
      <div class="p-input-icon-left" style="width:260px">
        <i class="pi pi-search"></i>
        <input pInputText [(ngModel)]="search" (input)="loadUsers()"
               placeholder="Nom ou email..." class="w-full">
      </div>
      <span class="text-xs text-slate-400">{{ users.length }} utilisateur(s)</span>
    </div>

    <p-table [value]="users" [paginator]="true" [rows]="10"
             [loading]="isLoading"
             [showCurrentPageReport]="true"
             currentPageReportTemplate="{first}-{last} sur {totalRecords}"
             responsiveLayout="scroll">

      <ng-template pTemplate="header">
        <tr>
          <th>Utilisateur</th>
          <th>Email</th>
          <th>Rôle</th>
          <th>Statut</th>
          <th>Inscription</th>
          <th class="text-center">Actions</th>
        </tr>
      </ng-template>

      <ng-template pTemplate="body" let-u>
        <tr>
          <td>
            <div class="flex items-center gap-3">
              <div class="admin-user-avatar">{{ initials(u.name) }}</div>
              <span class="font-semibold text-slate-800 text-sm">{{ u.name }}</span>
            </div>
          </td>
          <td class="text-slate-500 text-sm">{{ u.email }}</td>
          <td>
            <p-tag [value]="u.role | titlecase" [severity]="roleSeverity(u.role)"></p-tag>
          </td>
          <td>
            <p-tag [value]="u.is_active ? 'Actif' : 'Inactif'" [severity]="statusSeverity(u.is_active)"></p-tag>
          </td>
          <td class="text-slate-400 text-sm">{{ u.created_at | date:'dd/MM/yyyy' }}</td>
          <td>
            <div class="flex items-center justify-center gap-0.5">
              <button pButton pRipple icon="pi pi-pencil"
                      class="btn-ghost p-button-rounded p-button-sm"
                      pTooltip="Modifier le rôle" tooltipPosition="top"
                      (click)="openEdit(u)"></button>
              <button pButton pRipple
                      [icon]="u.is_active ? 'pi pi-eye-slash' : 'pi pi-eye'"
                      class="btn-ghost p-button-rounded p-button-sm"
                      [pTooltip]="u.is_active ? 'Désactiver' : 'Activer'" tooltipPosition="top"
                      (click)="toggle(u)"></button>
              <button pButton pRipple icon="pi pi-trash"
                      class="btn-danger-ghost p-button-rounded p-button-sm"
                      pTooltip="Supprimer" tooltipPosition="top"
                      (click)="confirmDelete(u)"></button>
            </div>
          </td>
        </tr>
      </ng-template>

      <ng-template pTemplate="emptymessage">
        <tr><td colspan="6">
          <div class="text-center py-12">
            <i class="pi pi-users text-4xl text-slate-200 block mb-3"></i>
            <p class="text-slate-400 text-sm m-0">Aucun utilisateur trouvé.</p>
          </div>
        </td></tr>
      </ng-template>

    </p-table>
  </div>
</div>

<!-- ── Dialog : créer ──────────────────────────────────────────── -->
<p-dialog header="Nouvel utilisateur" [(visible)]="showCreateDialog"
          [modal]="true" [draggable]="false" [style]="{ width: '460px' }" styleClass="rounded-dialog">

  <form [formGroup]="createForm" (ngSubmit)="saveCreate()" class="flex flex-col gap-4 pt-2">
    <div class="field">
      <label class="field-label">Nom complet <span class="field-required">*</span></label>
      <input pInputText formControlName="name" placeholder="Prénom Nom" class="w-full">
      <small class="field-error" *ngIf="createForm.get('name')?.invalid && createForm.get('name')?.touched">
        Nom requis (min 2 caractères).
      </small>
    </div>
    <div class="field">
      <label class="field-label">Email <span class="field-required">*</span></label>
      <input pInputText formControlName="email" type="email" placeholder="user@example.com" class="w-full">
    </div>
    <div class="field">
      <label class="field-label">Mot de passe <span class="field-required">*</span></label>
      <input pInputText formControlName="password" type="password" placeholder="Min. 8 caractères" class="w-full">
    </div>
    <div class="field">
      <label class="field-label">Rôle <span class="field-required">*</span></label>
      <p-dropdown formControlName="role" [options]="roleOptions"
                  optionLabel="label" optionValue="value" styleClass="w-full"></p-dropdown>
    </div>
  </form>

  <ng-template pTemplate="footer">
    <button pButton label="Annuler" icon="pi pi-times" class="btn-secondary p-button-sm"
            (click)="showCreateDialog = false"></button>
    <button pButton label="Créer" icon="pi pi-check" class="btn-primary p-button-sm"
            [loading]="isSaving" (click)="saveCreate()"></button>
  </ng-template>
</p-dialog>

<!-- ── Dialog : modifier rôle ─────────────────────────────────── -->
<p-dialog header="Modifier le rôle" [(visible)]="showEditDialog"
          [modal]="true" [draggable]="false" [style]="{ width: '360px' }" styleClass="rounded-dialog">

  <form [formGroup]="editForm" class="pt-2">
    <div class="field">
      <label class="field-label">Rôle de <strong>{{ selectedUser?.name }}</strong></label>
      <p-dropdown formControlName="role" [options]="roleOptions"
                  optionLabel="label" optionValue="value" styleClass="w-full"></p-dropdown>
    </div>
  </form>

  <ng-template pTemplate="footer">
    <button pButton label="Annuler" icon="pi pi-times" class="btn-secondary p-button-sm"
            (click)="showEditDialog = false"></button>
    <button pButton label="Enregistrer" icon="pi pi-check" class="btn-primary p-button-sm"
            [loading]="isSaving" (click)="saveEdit()"></button>
  </ng-template>
</p-dialog>
