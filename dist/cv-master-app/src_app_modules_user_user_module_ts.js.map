<div class="page-wrapper">

  <div class="page-header text-center">
    <h1>Choisissez votre plan</h1>
    <p>Déverrouillez tout le potentiel de CV Master avec un abonnement adapté à vos besoins.</p>
  </div>

  <!-- Loading skeletons -->
  <div *ngIf="isLoading" class="grid grid-cols-1 md:grid-cols-3 gap-6 max-w-5xl mx-auto">
    <div *ngFor="let _ of [1,2,3]" class="rounded-2xl border border-slate-200 p-7 flex flex-col gap-4">
      <p-skeleton height="3rem" borderRadius="12px"></p-skeleton>
      <p-skeleton height="1rem" width="60%"></p-skeleton>
      <p-skeleton height="1rem"></p-skeleton>
      <p-skeleton height="1rem"></p-skeleton>
      <p-skeleton height="2.5rem" borderRadius="10px"></p-skeleton>
    </div>
  </div>

  <div *ngIf="!isLoading" class="grid grid-cols-1 md:grid-cols-3 gap-6 max-w-5xl mx-auto">

    <div *ngFor="let plan of plans; let i = index"
         class="relative flex flex-col rounded-2xl overflow-hidden transition-all duration-300"
         [ngClass]="{
           'border-2 shadow-card scale-105': plan.name === 'Premium',
           'border border-slate-200 hover:shadow-medium': plan.name !== 'Premium'
         }"
         [style.borderColor]="plan.name === 'Premium' ? '#6366f1' : null">

      <!-- Popular badge -->
      <div *ngIf="plan.name === 'Premium'"
           class="absolute top-0 left-0 right-0 text-center py-2 text-xs font-bold text-white"
           style="background: linear-gradient(135deg,#6366f1,#8b5cf6)">
        ⭐ LE PLUS POPULAIRE
      </div>

      <!-- Card header -->
      <div class="px-7 pt-8 pb-6 text-center"
           [class.pt-12]="plan.name === 'Premium'"
           [ngClass]="plan.name === 'Premium' ? 'bg-gradient-soft' : 'bg-white'">

        <!-- Icon -->
        <div class="w-14 h-14 rounded-2xl mx-auto mb-4 flex items-center justify-center"
             [ngClass]="{
               'bg-slate-100': plan.name === 'Free',
               'bg-gradient-primary': plan.name === 'Premium',
               'bg-slate-800': plan.name === 'Pro'
             }">
          <i [class]="'pi text-xl ' + (plan.name === 'Free' ? 'pi-user text-slate-500' : plan.name === 'Premium' ? 'pi-star text-white' : 'pi-crown text-yellow-400')"></i>
        </div>

        <h2 class="text-xl font-bold text-slate-900 mb-1">{{ plan.name }}</h2>
        <div class="flex items-end justify-center gap-1 mt-3">
          <span class="text-4xl font-extrabold text-slate-900">{{ plan.price }}</span>
        </div>
        <p *ngIf="plan.isCurrent" class="mt-2 text-xs font-semibold text-emerald-600 bg-emerald-50 inline-block px-2 py-0.5 rounded-full">
          Votre plan actuel
        </p>
      </div>

      <!-- Separator -->
      <div [ngClass]="plan.name === 'Premium' ? 'border-t border-indigo-200' : 'border-t border-slate-100'"></div>

      <!-- Features list -->
      <div class="px-7 py-6 flex-1 bg-white">
        <ul class="flex flex-col gap-3">
          <li *ngFor="let feature of plan.features"
              class="flex items-start gap-3 text-sm text-slate-700">
            <div class="w-5 h-5 rounded-full flex items-center justify-center shrink-0 mt-0.5"
                 [ngClass]="plan.name === 'Premium' ? 'bg-indigo-100' : 'bg-slate-100'">
              <i class="pi pi-check text-xs"
                 [ngClass]="plan.name === 'Premium' ? 'text-indigo-600' : 'text-slate-500'"></i>
            </div>
            {{ feature }}
          </li>
        </ul>
      </div>

      <!-- CTA -->
      <div class="px-7 pb-7 bg-white">
        <button pButton pRipple
                [label]="plan.isCurrent ? 'Plan actuel' : (plan.name === 'Free' ? 'Commencer gratuitement' : 'Choisir ' + plan.name)"
                [disabled]="!!plan.isCurrent"
                [ngClass]="ctaClass(plan)"
                class="w-full p-button-lg" style="border-radius:10px;padding:.9rem;">
        </button>
      </div>

    </div>
  </div>

  <!-- Reassurance footer -->
  <div class="flex flex-wrap justify-center gap-8 mt-12 text-sm text-slate-500">
    <div class="flex items-center gap-2">
      <i class="pi pi-shield text-indigo-400"></i>
      Paiement sécurisé SSL
    </div>
    <div class="flex items-center gap-2">
      <i class="pi pi-undo text-indigo-400"></i>
      Résiliation à tout moment
    </div>
    <div class="flex items-center gap-2">
      <i class="pi pi-clock text-indigo-400"></i>
      Support 7j/7
    </div>
  </div>

</div>
