<div class="grid grid-cols-1 lg:grid-cols-2 gap-8 p-4">

  <!-- Left Column: The Form -->
  <div class="lg:col-span-1">
    <div class="bg-gray-50 p-4 rounded-lg shadow">
      <h2 class="text-2xl font-bold mb-6 text-center text-gray-700">CV Editor</h2>
      <form [formGroup]="cvForm" (ngSubmit)="onSubmit()" class="space-y-6">

        <!-- Personal Information -->
        <p-fieldset legend="Personal Information" [toggleable]="true">
          <div formGroupName="personalInfo" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="flex flex-col">
              <label for="name" class="font-semibold mb-1">Full Name</label>
              <input id="name" type="text" pInputText formControlName="name">
            </div>
            <div class="flex flex-col">
              <label for="jobTitle" class="font-semibold mb-1">Job Title</label>
              <input id="jobTitle" type="text" pInputText formControlName="jobTitle">
            </div>
            <div class="flex flex-col">
              <label for="email" class="font-semibold mb-1">Email</label>
              <input id="email" type="email" pInputText formControlName="email">
            </div>
            <div class="flex flex-col">
              <label for="phone" class="font-semibold mb-1">Phone</label>
              <input id="phone" type="text" pInputText formControlName="phone">
            </div>
            <div class="flex flex-col md:col-span-2">
              <label for="address" class="font-semibold mb-1">Address</label>
              <input id="address" type="text" pInputText formControlName="address">
            </div>
          </div>
        </p-fieldset>

        <!-- Professional Summary -->
        <p-fieldset legend="Professional Summary" [toggleable]="true">
          <textarea pInputTextarea formControlName="professionalSummary" [rows]="5" class="w-full" placeholder="Write a short summary about your professional background..."></textarea>
        </p-fieldset>

        <!-- Experiences -->
        <p-fieldset legend="Work Experience" [toggleable]="true">
          <div formArrayName="experiences">
            <div *ngFor="let exp of experiences.controls; let i=index" [formGroupName]="i" class="mb-4 p-4 border rounded-lg bg-white relative">
              <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <input type="text" pInputText placeholder="Company" formControlName="company">
                <input type="text" pInputText placeholder="Position" formControlName="position">
                <input type="text" pInputText placeholder="Start Date (e.g., 2020-01)" formControlName="startDate">
                <input type="text" pInputText placeholder="End Date (e.g., 2022-12 or Present)" formControlName="endDate">
                <textarea pInputTextarea placeholder="Description of your role and achievements" formControlName="description" [rows]="3" class="w-full md:col-span-2"></textarea>
              </div>
              <button pButton type="button" icon="pi pi-trash" class="p-button-danger p-button-sm absolute top-2 right-2" (click)="removeExperience(i)"></button>
            </div>
            <button pButton type="button" label="Add Experience" icon="pi pi-plus" class="p-button-secondary" (click)="addExperience()"></button>
          </div>
        </p-fieldset>

        <!-- Educations -->
        <p-fieldset legend="Education" [toggleable]="true">
          <div formArrayName="educations">
            <div *ngFor="let edu of educations.controls; let i=index" [formGroupName]="i" class="mb-4 p-4 border rounded-lg bg-white relative">
              <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <input type="text" pInputText placeholder="Institution" formControlName="institution" class="md:col-span-2">
                <input type="text" pInputText placeholder="Degree or Certificate" formControlName="degree">
                <input type="text" pInputText placeholder="End Date" formControlName="endDate">
              </div>
              <button pButton type="button" icon="pi pi-trash" class="p-button-danger p-button-sm absolute top-2 right-2" (click)="removeEducation(i)"></button>
            </div>
            <button pButton type="button" label="Add Education" icon="pi pi-plus" class="p-button-secondary" (click)="addEducation()"></button>
          </div>
        </p-fieldset>

        <!-- Skills & Languages -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <p-fieldset legend="Skills">
              <div formArrayName="skills">
                  <div *ngFor="let skill of skills.controls; let i=index" [formGroupName]="i" class="mb-2 flex items-center gap-2">
                      <input type="text" pInputText placeholder="e.g., Angular, Project Management" formControlName="name" class="flex-grow">
                      <button pButton type="button" icon="pi pi-trash" class="p-button-danger p-button-text" (click)="removeSkill(i)"></button>
                  </div>
                  <button pButton type="button" label="Add Skill" icon="pi pi-plus" class="p-button-secondary p-button-sm mt-2" (click)="addSkill()"></button>
              </div>
          </p-fieldset>
          <p-fieldset legend="Languages">
              <div formArrayName="languages">
                  <div *ngFor="let lang of languages.controls; let i=index" [formGroupName]="i" class="mb-2 flex items-center gap-2">
                      <input type="text" pInputText placeholder="e.g., French" formControlName="name" class="w-1/2">
                      <input type="text" pInputText placeholder="e.g., Native" formControlName="proficiency" class="w-1/2">
                      <button pButton type="button" icon="pi pi-trash" class="p-button-danger p-button-text" (click)="removeLanguage(i)"></button>
                  </div>
                  <button pButton type="button" label="Add Language" icon="pi pi-plus" class="p-button-secondary p-button-sm mt-2" (click)="addLanguage()"></button>
              </div>
          </p-fieldset>
        </div>

        <div class="text-right mt-6">
          <button pButton type="submit" label="Save CV" [disabled]="cvForm.invalid" class="p-button-success"></button>
        </div>
      </form>
    </div>
  </div>

  <!-- Right Column: The Preview -->
  <div class="lg:col-span-1">
    <app-cv-preview [cvData]="cvData$ | async"></app-cv-preview>
  </div>

</div>
