<div class="p-4 max-w-6xl mx-auto">
  <h1 class="text-3xl font-bold text-center mb-2">Our Plans</h1>
  <p class="text-center text-gray-500 mb-8">Choose the plan that's right for you.</p>

  <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
    <div *ngFor="let plan of plans"
         class="border rounded-lg shadow-lg flex flex-col"
         [ngClass]="{'border-2 border-blue-500 transform scale-105 bg-white': plan.isCurrent, 'bg-gray-50': !plan.isCurrent}">

      <div class="p-6 text-center">
        <h2 class="text-2xl font-bold">{{ plan.name }}</h2>
        <p class="text-4xl font-bold my-4">{{ plan.price }}</p>
      </div>

      <ul class="space-y-4 p-6 flex-grow">
        <li *ngFor="let feature of plan.features" class="flex items-start">
          <i class="pi pi-check-circle text-green-500 mr-3 mt-1"></i>
          <span>{{ feature }}</span>
        </li>
      </ul>

      <div class="p-6 mt-auto">
        <button pButton
                [label]="plan.isCurrent ? 'Your Current Plan' : 'Choose Plan'"
                [disabled]="plan.isCurrent"
                class="w-full"
                [ngClass]="{'p-button-success': plan.isCurrent, 'p-button-primary': !plan.isCurrent}"></button>
      </div>
    </div>
  </div>
</div>
